# One source, one partitioned sweep. The three-stage plan/shard/artifact dance
# in the fleet template exists to fan thousands of endpoints across 20 runners;
# here ~200 endpoints run in one job in a few minutes.
name: capture-weekly

on:
  schedule:
    - cron: "35 3 * * 1" # Monday, off the hour -- GitHub's scheduler is contended at :00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-commits
  cancel-in-progress: false

env:
  WSS_CONTACT: ${{ secrets.WSS_CONTACT || format('{0} +https://github.com/{1}', github.repository_owner, github.repository) }}
  # MUST match the registry's `cadence:`. A mismatch makes `wss plan` return []
  # and the capture silently does nothing while the workflow stays green.
  CADENCE: weekly
  ENGINE_SPEC: "wss[object] @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v0.6.55"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"

      # THE ENDPOINT LIST IS COMMITTED, NOT REGENERATED EVERY RUN. An earlier
      # version ran examples/refresh_endpoints.py here, which pages the whole
      # store to DISCOVER how many pages exist -- and then `wss capture` pages
      # it all again to STORE it. The same ~160 requests twice a week, turning
      # an 8-minute job into 30 and doubling the load on the publisher for no
      # extra data.
      #
      # The list changes only when the store's SHAPE changes (a new category, a
      # moved wall), not when its contents do. So it is a maintenance script run
      # by hand, exactly as wss-gho generates its 3,321 endpoints once. If a
      # partition has outgrown its page count the new pages are simply missed
      # until someone re-runs it -- visible as a flat actor count -- and if one
      # has shrunk, the now-empty page fails min_bytes and quarantines loudly.
      - name: Validate registry (hard gate)
        run: wss validate

      - name: Confirm the source is planned at this cadence
        id: plan
        run: |
          count=$(wss plan --cadence "$CADENCE" --shards 1 --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt 1 ]; then
            echo "plan returned $count at cadence $CADENCE -- refusing to report success" >&2
            exit 1
          fi

      # "1/1" -- the shard spec is ONE-BASED and needs both halves. `--shard 0`
      # is rejected as malformed and `0/1` as out of range.
      - name: Capture
        run: wss capture --cadence "$CADENCE" --shard 1/1

      - name: Drop quarantine (triage lives in CI artifacts, never in git)
        if: always()
        run: |
          if [ -d quarantine ]; then tar -czf quarantine.tgz quarantine && rm -rf quarantine; fi
      - name: Upload quarantine if anything was rejected
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-${{ github.run_id }}
          path: quarantine.tgz
          if-no-files-found: ignore
          retention-days: 90

      - name: Heartbeat
        run: |
          mkdir -p state
          printf '{"cadence":"%s","sources_planned":%s,"completed_at":"%s","run_id":"%s","workflow":"%s"}\n' \
            "$CADENCE" "${{ steps.plan.outputs.count }}" "$(date -u +%FT%TZ)" \
            "${{ github.run_id }}" "${{ github.workflow }}" > state/last_run.json

      - name: Commit with rebase-retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw manifest registry state
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "capture($CADENCE): run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "rebase conflict on attempt $i -- not a push race" >&2
            fi
          done
          echo "push failed after 5 attempts" >&2
          exit 1
