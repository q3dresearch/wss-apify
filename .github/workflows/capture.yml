# One source, one partitioned sweep. The three-stage plan/shard/artifact dance
# in the fleet template exists to fan thousands of endpoints across 20 runners;
# here ~200 endpoints run in one job in a few minutes.
name: capture

on:
  schedule:
    # WEEKLY, MONDAY. This was daily from 2026-09-24 to 2026-10-06 to prove the
    # schedule fires, and it did: thirteen consecutive daily firings, each
    # starting five to seven hours after the 03:35 UTC slot (GitHub's scheduler
    # is best-effort and contended), none skipped. That answered the question
    # the trial existed to ask.
    #
    # It was then reverted because it was costing more than it taught. Daily is
    # ~24 GB/year of raw against weekly's ~3.5, and it grew the derived output by
    # ~720k observations a day -- which is what took the job past what a hosted
    # runner survives (see the Capture/commit note below).
    #
    # The cron is a FREQUENCY, not a cadence. The registry and CADENCE below say
    # `weekly`; the two must agree or `wss plan` returns [] and the job goes
    # green having captured nothing.
    - cron: "35 3 * * 1" # Monday, off the hour -- GitHub's scheduler is contended at :00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-commits
  cancel-in-progress: false

env:
  WSS_CONTACT: ${{ secrets.WSS_CONTACT || format('{0} +https://github.com/{1}', github.repository_owner, github.repository) }}
  # MUST match the registry's `cadence:`. A mismatch makes `wss plan` return []
  # and the capture silently does nothing while the workflow stays green.
  CADENCE: weekly
  ENGINE_SPEC: "wss[object] @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v0.6.58"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"

      # THE ENDPOINT LIST IS COMMITTED, NOT REGENERATED EVERY RUN. An earlier
      # version ran examples/refresh_endpoints.py here, which pages the whole
      # store to DISCOVER how many pages exist -- and then `wss capture` pages
      # it all again to STORE it. The same ~160 requests twice a week, turning
      # an 8-minute job into 30 and doubling the load on the publisher for no
      # extra data.
      #
      # The list changes only when the store's SHAPE changes (a new category, a
      # moved wall), not when its contents do. So it is a maintenance script run
      # by hand, exactly as wss-gho generates its 3,321 endpoints once. If a
      # partition has outgrown its page count the new pages are simply missed
      # until someone re-runs it -- visible as a flat actor count -- and if one
      # has shrunk, the now-empty page fails min_bytes and quarantines loudly.
      - name: Validate registry (hard gate)
        run: wss validate

      - name: Confirm the source is planned at this cadence
        id: plan
        run: |
          count=$(wss plan --cadence "$CADENCE" --shards 1 --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt 1 ]; then
            echo "plan returned $count at cadence $CADENCE -- refusing to report success" >&2
            exit 1
          fi

      # "1/1" -- the shard spec is ONE-BASED and needs both halves. `--shard 0`
      # is rejected as malformed and `0/1` as out of range.
      - name: Capture
        env:
          # REQUIRED, because this source declares `storage: object`. Without
          # these the object config resolves empty and the job cannot write a
          # byte -- wss-drug-scarcity ran red for three days that way, so the
          # wiring ships rather than being remembered at the point it is needed.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WSS_OBJECT_PREFIX: ${{ secrets.WSS_OBJECT_PREFIX }}
        run: wss capture --cadence "$CADENCE" --shard 1/1

      # THE PUBLISHABLE HALF. Raw records went to R2 above and are never
      # committed; the aggregate runs here so git gets the 5.6 KB that carries no
      # actor identity, plus the charts drawn from it.
      #
      # `wss derive` and `wss schema` USED TO RUN HERE AND NO LONGER DO. Neither
      # feeds this step: store_stats.py reads raw from R2 and the charts read
      # public/stats-*.json. They fed only SCHEMA.md, and they were the reason
      # captures were lost. Derive rebuilds EVERY partition from ALL raw each run
      # -- 23.4M rows by 2026-10-06, including a closed September rewritten
      # identically every time -- into derived/observations, which is gitignored,
      # so the 23M rows were built, read back by `wss schema`, and discarded.
      # On 2026-10-04, -05 and -06 the runner was killed within 1-7 minutes of
      # derive finishing. Commit comes LAST in this job, so the capture had
      # already succeeded and its manifest rows died with the runner.
      #
      # THE RULE THAT FOLLOWS: nothing reproducible may sit between an
      # irreversible capture and the commit that records it. derive.yml still
      # rebuilds weekly, in a job whose failure loses nothing.
      - name: Aggregate and redraw
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WSS_OBJECT_PREFIX: ${{ secrets.WSS_OBJECT_PREFIX }}
        run: |
          python examples/store_stats.py
          for c in examples/chart-*.py; do python "$c"; done

      - name: Drop quarantine (triage lives in CI artifacts, never in git)
        if: always()
        run: |
          if [ -d quarantine ]; then tar -czf quarantine.tgz quarantine && rm -rf quarantine; fi
      - name: Upload quarantine if anything was rejected
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-${{ github.run_id }}
          path: quarantine.tgz
          if-no-files-found: ignore
          retention-days: 90

      # The heartbeat carries WHAT TRIGGERED THE RUN and WHEN GITHUB QUEUED IT,
      # not just that it finished. Cron reliability is the point of the trial
      # window, and it is invisible without these: a skipped night leaves no
      # trace at all, and a two-hour delay looks identical to an on-time run
      # once you only have completed_at. `event` separates a real scheduled
      # firing from a manual workflow_dispatch, which would otherwise inflate
      # the apparent reliability of the cron.
      - name: Heartbeat
        run: |
          mkdir -p state
          printf '{"cadence":"%s","sources_planned":%s,"completed_at":"%s","queued_at":"%s","event":"%s","cron":"%s","run_id":"%s","attempt":"%s","workflow":"%s"}\n' \
            "$CADENCE" "${{ steps.plan.outputs.count }}" "$(date -u +%FT%TZ)" \
            "${{ github.event.repository.updated_at }}" "${{ github.event_name }}" \
            "${{ github.event.schedule }}" "${{ github.run_id }}" \
            "${{ github.run_attempt }}" "${{ github.workflow }}" > state/last_run.json

      - name: Commit with rebase-retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # raw/ and derived/observations are gitignored -- they hold the
          # publisher's records and redistribution is not established.
          git add -A manifest registry state public examples/charts SCHEMA.md schema SOURCES.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "capture($CADENCE): run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "rebase conflict on attempt $i -- not a push race" >&2
            fi
          done
          echo "push failed after 5 attempts" >&2
          exit 1
