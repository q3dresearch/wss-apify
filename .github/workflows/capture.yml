# One source, one partitioned sweep. The three-stage plan/shard/artifact dance
# in the fleet template exists to fan thousands of endpoints across 20 runners;
# here ~200 endpoints run in one job in a few minutes.
name: capture

on:
  schedule:
    # TEMPORARILY DAILY, TO PROVE THE SCHEDULE ACTUALLY FIRES. GitHub's cron is
    # best-effort and its first runs on a new repo are often delayed or skipped
    # entirely, so a weekly job takes a month to tell you it is broken. Daily
    # gives seven answers a week. REVERT TO "35 3 * * 1" (Monday) once proven.
    #
    # This is a CRON frequency, not a cadence change. The registry still says
    # `cadence: weekly` and CADENCE below still says weekly, so `wss plan` keeps
    # matching the source -- the two must agree or plan returns [] and the job
    # goes green having captured nothing. What changes is only how often the
    # runner wakes up.
    #
    # THE PRICE, SO IT IS NOT DISCOVERED LATER: one capture is 67 MB of raw.
    # Daily is ~24 GB/year against weekly's ~3.5 GB. Fine for a few days of
    # proving the cron; not something to leave running.
    - cron: "35 3 * * *" # daily, off the hour -- GitHub's scheduler is contended at :00
  workflow_dispatch:

# TRIAL WINDOW: daily until 2026-10-24, then revert the cron above to
# "35 3 * * 1" (Monday). The job warns on every run past that date rather than
# failing, because a missed capture is irreversible and a noisy one is not.

permissions:
  contents: write

concurrency:
  group: fleet-commits
  cancel-in-progress: false

env:
  WSS_CONTACT: ${{ secrets.WSS_CONTACT || format('{0} +https://github.com/{1}', github.repository_owner, github.repository) }}
  # MUST match the registry's `cadence:`. A mismatch makes `wss plan` return []
  # and the capture silently does nothing while the workflow stays green.
  CADENCE: weekly
  # The trial cron above is daily; this is the date it stops being justified.
  REVERT_AFTER: "2026-10-24"
  ENGINE_SPEC: "wss[object] @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v0.6.57"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"

      # THE ENDPOINT LIST IS COMMITTED, NOT REGENERATED EVERY RUN. An earlier
      # version ran examples/refresh_endpoints.py here, which pages the whole
      # store to DISCOVER how many pages exist -- and then `wss capture` pages
      # it all again to STORE it. The same ~160 requests twice a week, turning
      # an 8-minute job into 30 and doubling the load on the publisher for no
      # extra data.
      #
      # The list changes only when the store's SHAPE changes (a new category, a
      # moved wall), not when its contents do. So it is a maintenance script run
      # by hand, exactly as wss-gho generates its 3,321 endpoints once. If a
      # partition has outgrown its page count the new pages are simply missed
      # until someone re-runs it -- visible as a flat actor count -- and if one
      # has shrunk, the now-empty page fails min_bytes and quarantines loudly.
      - name: Validate registry (hard gate)
        run: wss validate

      - name: Confirm the source is planned at this cadence
        id: plan
        run: |
          count=$(wss plan --cadence "$CADENCE" --shards 1 --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt 1 ]; then
            echo "plan returned $count at cadence $CADENCE -- refusing to report success" >&2
            exit 1
          fi

      # "1/1" -- the shard spec is ONE-BASED and needs both halves. `--shard 0`
      # is rejected as malformed and `0/1` as out of range.
      # A temporary cron becomes a permanent one the moment it stops being
      # mentioned. This makes the deadline part of the run instead of part of
      # someone's memory: after the trial window every run carries a warning
      # annotation in the Actions UI until the cron is reverted.
      - name: Trial window check
        run: |
          if [ "$(date -u +%Y-%m-%d)" \> "$REVERT_AFTER" ]; then
            echo "::warning title=Daily cron has outlived its trial::The daily schedule was" \
                 "for shaking out the pipeline until $REVERT_AFTER. Revert the cron in" \
                 ".github/workflows/capture.yml to '35 3 * * 1' (weekly) -- daily is" \
                 "12.8 GB/yr against weekly's 1.82 GB/yr, and the registry has always said weekly."
          else
            echo "daily trial active until $REVERT_AFTER"
          fi

      - name: Capture
        run: wss capture --cadence "$CADENCE" --shard 1/1

      - name: Drop quarantine (triage lives in CI artifacts, never in git)
        if: always()
        run: |
          if [ -d quarantine ]; then tar -czf quarantine.tgz quarantine && rm -rf quarantine; fi
      - name: Upload quarantine if anything was rejected
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-${{ github.run_id }}
          path: quarantine.tgz
          if-no-files-found: ignore
          retention-days: 90

      # The heartbeat carries WHAT TRIGGERED THE RUN and WHEN GITHUB QUEUED IT,
      # not just that it finished. Cron reliability is the point of the trial
      # window, and it is invisible without these: a skipped night leaves no
      # trace at all, and a two-hour delay looks identical to an on-time run
      # once you only have completed_at. `event` separates a real scheduled
      # firing from a manual workflow_dispatch, which would otherwise inflate
      # the apparent reliability of the cron.
      - name: Heartbeat
        run: |
          mkdir -p state
          printf '{"cadence":"%s","sources_planned":%s,"completed_at":"%s","queued_at":"%s","event":"%s","cron":"%s","run_id":"%s","attempt":"%s","workflow":"%s"}\n' \
            "$CADENCE" "${{ steps.plan.outputs.count }}" "$(date -u +%FT%TZ)" \
            "${{ github.event.repository.updated_at }}" "${{ github.event_name }}" \
            "${{ github.event.schedule }}" "${{ github.run_id }}" \
            "${{ github.run_attempt }}" "${{ github.workflow }}" > state/last_run.json

      - name: Commit with rebase-retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw manifest registry state
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "capture($CADENCE): run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "rebase conflict on attempt $i -- not a push race" >&2
            fi
          done
          echo "push failed after 5 attempts" >&2
          exit 1
