gates:
  expect_status: 200
  # A zero-item page is ~120 bytes of envelope; a real page is tens of KB.
  # refresh_endpoints.py only writes endpoints it saw return items, so a page
  # that has gone empty since is a genuine change worth quarantining.
  min_bytes: 2000
  content_type_any: [json]
  must_contain: ["totalUsers30Days", "\"items\""]
  # NO must_not_contain, DELIBERATELY, AND THIS WAS MEASURED THE HARD WAY.
  # The first version blacklisted "Access Denied", "Too Many Requests" and
  # "rate limit". It quarantined 54 of the first 64 pages -- 84% -- because
  # this is a store of SCRAPERS and their descriptions discuss rate limits
  # constantly. The gate matched the publisher's content, not an error page.
  #
  # A text blacklist cannot work on an endpoint whose payload is arbitrary
  # user-written prose: any phrase an error page might use, some developer has
  # already put in a description. The positive gates do the work instead --
  # expect_status, content_type_any, min_bytes, and must_contain on a field
  # name that only a real store response carries.
  # Deliberately loose. The store is WRITTEN WHILE IT IS READ -- `total` drifted
  # 65,048 -> 66,630 inside one sweep -- so page N holds a different slice each
  # week and a mid-range page legitimately returns anywhere from 384 to 959
  # items for the same limit=1000. A tight shrink gate would quarantine normal
  # churn. min_bytes plus must_contain is what actually catches a bad response.
  max_shrink_pct: 90
