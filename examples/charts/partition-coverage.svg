<line x1="28" y1="742.0" x2="852" y2="742.0" stroke="#e3e2db"/>
<text x="28.0" y="758.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Apify store API, one sweep 2026-09-24. A partition that ends at the wall is TRUNCATED and its visible set is popularity-ordered, so</text>
<text x="28.0" y="771.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">an actor first appears there when it crosses a threshold, not when it is published — first-seen is an age only in the partitions</text>
<text x="28.0" y="784.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">that end early.</text>
