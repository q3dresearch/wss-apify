<text x="730.0" y="174.0" font-size="9" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.8" style="font-variant-numeric: tabular-nums">READ IT AS FOUR CORNERS</text>
<text x="730.0" y="194.0" font-size="10" fill="#b4472e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">top-left — big and</text>
<text x="730.0" y="206.5" font-size="10" fill="#b4472e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">static: pure waste, and</text>
<text x="730.0" y="219.0" font-size="10" fill="#b4472e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">this is where the three</text>
<text x="730.0" y="231.5" font-size="10" fill="#b4472e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">dropped fields sit</text>
<text x="730.0" y="254.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">top-right — big and</text>
<text x="730.0" y="266.5" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">live: expensive but</text>
<text x="730.0" y="279.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">real, keep it</text>
<text x="730.0" y="291.5" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">(pricingPerEvent)</text>
<text x="730.0" y="314.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">bottom-right — cheap</text>
<text x="730.0" y="326.5" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and always moving: the</text>
<text x="730.0" y="339.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">usage counters, and why</text>
<text x="730.0" y="351.5" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">dedupe never fires here</text>
<text x="730.0" y="374.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">bottom-left — cheap and</text>
<text x="730.0" y="386.5" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">static: identity, free</text>
<text x="730.0" y="399.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">to carry (id, name)</text>
<line x1="28" y1="538.0" x2="852" y2="538.0" stroke="#e3e2db"/>
<text x="28.0" y="554.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Apify store API. Before-picture is the ONLY Internet Archive memento of this endpoint (2026-08-18, 949 actors); 784 of them are</text>
<text x="28.0" y="567.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">still present. One gap of 37 days is a weak estimate of a weekly change rate and a single pair cannot see a field that changes and</text>
<text x="28.0" y="580.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">changes back.</text>
</svg>