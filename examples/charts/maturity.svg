<text x="28.0" y="490.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">2 are answered from captures already held and 2 need the series to reach a stated length. The other 3 are open for a different</text>
