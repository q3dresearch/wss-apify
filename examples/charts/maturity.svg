<line x1="28" y1="543.0" x2="852" y2="543.0" stroke="#e3e2db"/>
<text x="28.0" y="559.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Read from this repo, not typed: questions and their status from the README table, cadence from registry/, first capture from</text>
<text x="28.0" y="572.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">manifest/. A month is 30.44 days. THIS PLATE MEASURES NOTHING ABOUT THE WORLD — it is the capture plan drawn as a plan, and it is</text>
<text x="28.0" y="585.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">wrong the moment the table says something the capture does not deliver.</text>
